@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12110f;--fg:#efeadf;--mu:#a39b8c;--cd:#1c1a17;--ln:#2e2b26;--ac:#d1ad63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12110f;--fg:#efeadf;--mu:#a39b8c;--cd:#1c1a17;--ln:#2e2b26;--ac:#d1ad63;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:14px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font:600 24px "Cormorant Garamond",Georgia,serif;letter-spacing:.02em;color:var(--fg);text-decoration:none;margin-right:auto}.logo b{color:var(--ac)}
nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:var(--mu);text-decoration:none;font-size:14px}nav a:hover{color:var(--ac)}
select,button,input{font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:7px 10px}button{cursor:pointer}
.hero{min-height:82vh;display:flex;align-items:flex-end;padding:0 24px 64px;background:linear-gradient(180deg,rgba(10,9,8,.25),rgba(10,9,8,.85)),var(--i1) center/cover;color:#fff}
.hero>div{max-width:860px;margin:auto 0 0;animation:up .9s ease both}.hero p.k{letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#e2c786}
.hero h1{font-size:clamp(40px,7vw,84px);margin:10px 0 16px}.hero p{font-size:18px;max-width:620px;opacity:.9}
.cta{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:99px;background:#d1ad63;color:#1d1b19;text-decoration:none;font-weight:500}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
section{max-width:1160px;margin:auto;padding:84px 24px 0}section>h2{font-size:clamp(32px,4vw,48px);margin-bottom:8px}
